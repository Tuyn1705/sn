<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ===== MÀU SẮC: sửa ở đây ===== */
:root{--pink:#ff7eb6;--rose:#e8497f;--orange:#ffa062;--cream:#fff1e6;--text:#ffe9f1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Quicksand',sans-serif;color:var(--text);overflow-x:hidden;
  background:radial-gradient(120% 80% at 50% -10%,#5a1638 0,#2a0b1e 45%,#12060c 100%) fixed}
body.lock{overflow:hidden;height:100svh}
#fall{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.scene{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 32px}

/* ===== Tiêu đề ===== */
h1{text-align:center;line-height:1.15}
.t1{display:block;font-family:'Pacifico',cursive;font-size:clamp(34px,9.5vw,64px);filter:drop-shadow(0 0 16px rgba(255,126,182,.45))}
.L{display:inline-block;animation:drop .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-44px) rotate(-12deg) scale(.6)}to{opacity:1;transform:none}}
.name{display:block;font-family:'Dancing Script',cursive;font-weight:700;font-size:clamp(34px,10vw,58px);color:var(--cream);
  text-shadow:0 0 22px rgba(255,160,98,.65);animation:drop 1s .95s cubic-bezier(.3,1.4,.5,1) both}

/* ===== Bánh kem ===== */
.cakeWrap{position:relative;z-index:3;margin-top:10px;display:flex;flex-direction:column;align-items:center;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.candles{display:flex;gap:8px;margin-bottom:-4px;position:relative;z-index:4}
.candle{position:relative;padding-top:44px;text-align:center}
.digit{display:block;font:700 78px/1 'Quicksand',sans-serif;color:transparent;
  background:repeating-linear-gradient(-45deg,#fff7ef 0 9px,#ff8fbd 9px 18px);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 3px 0 #c93b78) drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.wick{position:absolute;top:36px;left:50%;width:3px;height:22px;margin-left:-1.5px;background:#4a2a2a;border-radius:2px}
.flame{position:absolute;top:6px;left:50%;margin-left:-8px;width:16px;height:30px;transform-origin:50% 100%;
  border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:radial-gradient(ellipse at 50% 75%,#fff6c0 0,#ffc65a 40%,#ff7a2f 85%);
  box-shadow:0 0 18px 7px rgba(255,160,80,.5);animation:flick .35s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.92,1.1) rotate(3deg)}}
.flame.bend{animation:bend .5s ease-in forwards}
@keyframes bend{to{transform:rotate(62deg) scale(.8,.65)}}
.flame.out{animation:out .25s forwards}
@keyframes out{to{transform:rotate(62deg) scale(0);opacity:0}}
.smoke{position:absolute;top:14px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:rgba(255,230,240,.7);filter:blur(4px);animation:smoke 1.9s ease-out forwards}
@keyframes smoke{to{transform:translate(22px,-80px) scale(4.5);opacity:0}}
.tier{position:relative;border-radius:16px 16px 8px 8px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12),0 6px 14px rgba(0,0,0,.35);
  background:radial-gradient(circle,rgba(255,244,236,.75) 2px,transparent 3px) 6px 32px/26px 24px,var(--g)}
.tier::before{content:'';position:absolute;left:0;right:0;top:0;height:30px;border-radius:inherit;
  background:linear-gradient(#fff2e8,#fff2e8) top/100% 12px no-repeat,radial-gradient(circle at 50% 0,#fff2e8 9px,transparent 10px) 0 6px/22px 24px repeat-x}
.tier::after{content:'';position:absolute;left:0;right:0;bottom:8px;height:12px;background:radial-gradient(circle,#fff2e8 4px,transparent 5px) 0 0/18px 12px repeat-x}
.ta{width:150px;height:62px;--g:linear-gradient(#ff9ec7,#ff6fa5);z-index:3}
.tb{width:210px;height:74px;margin-top:-6px;--g:linear-gradient(#ffb48a,#ff7f8f);z-index:2}
.tc{width:270px;height:86px;margin-top:-6px;--g:linear-gradient(#ff8fb3,#e8497f);z-index:1}
.plate{position:relative;width:312px;height:20px;margin-top:-10px;border-radius:50%;background:linear-gradient(#ffe0ec,#ff9ec7);box-shadow:0 12px 26px rgba(255,126,182,.35)}
.wind{position:absolute;left:-70px;right:-70px;top:0;height:150px;overflow:hidden;pointer-events:none;z-index:6}
.wind i{position:absolute;left:0;height:3px;width:130px;border-radius:3px;background:linear-gradient(90deg,transparent,#ffd1e3,transparent);opacity:0}

/* ===== Nút + thư ===== */
.actions{position:relative;z-index:2;width:100%;height:170px;margin-top:20px;display:flex;justify-content:center}
.btn{position:absolute;top:14px;border:0;cursor:pointer;font:700 18px 'Quicksand',sans-serif;color:#2a0b1e;padding:14px 30px;border-radius:40px;
  background:linear-gradient(90deg,var(--pink),var(--orange));box-shadow:0 6px 24px rgba(255,126,182,.5);transition:transform .2s;animation:pulse 1.8s ease-in-out infinite}
.btn:hover{transform:scale(1.06)}
@keyframes pulse{50%{box-shadow:0 6px 34px rgba(255,160,98,.8)}}
.envBox{position:absolute;top:0;opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.env{position:relative;width:170px;height:112px;cursor:pointer;perspective:600px;animation:bob 2.6s ease-in-out infinite}
.env>*{position:absolute}
.e-back{inset:0;background:#d63f74;border-radius:8px}
.e-paper{left:10px;right:10px;top:8px;height:96px;background:#fff4ec;border-radius:4px;z-index:1;transition:transform .7s .35s cubic-bezier(.3,1.3,.5,1)}
.e-paper::after{content:'';position:absolute;left:14px;right:14px;top:16px;height:30px;background:repeating-linear-gradient(rgba(255,126,182,.5) 0 2px,transparent 2px 10px)}
.e-front{inset:0;z-index:2;border-radius:8px;background:linear-gradient(135deg,#ff8fb8,#ff6c9d);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.e-flap{left:0;right:0;top:0;height:68px;z-index:3;transform-origin:50% 0;background:linear-gradient(#ff7aa8,#ff5c93);clip-path:polygon(0 0,100% 0,50% 100%)}
.seal{left:50%;top:52px;width:30px;height:30px;margin:-15px 0 0 -15px;z-index:4;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#ffb36b,#ff7a59);box-shadow:0 2px 6px rgba(0,0,0,.3);transition:opacity .3s}
.open .e-paper{transform:translateY(-62px)}
.open .e-flap{animation:flap .7s forwards}
.open .seal{opacity:0}
@keyframes flap{0%{transform:rotateX(0);z-index:3}49%{z-index:3}50%{z-index:0}100%{transform:rotateX(180deg);z-index:0}}
.hint{margin-top:16px;font-size:14px;color:#ffc9dc;animation:pulse2 1.8s ease-in-out infinite}
@keyframes pulse2{50%{opacity:.5}}

/* ===== Ảnh bay ===== */
.ph{position:fixed;left:0;top:0;z-index:100;background:#fff7f1;padding:5px 5px 16px;border-radius:5px;box-shadow:0 8px 22px rgba(0,0,0,.45);will-change:transform;opacity:0}
.ph img{display:block;width:100%;height:100%;object-fit:cover;border-radius:3px}

/* ===== Thư + vòng ảnh ===== */
#letterScene{display:none;position:relative;z-index:2;min-height:100svh;padding:44px 16px 80px;text-align:center}
.paper{max-width:560px;margin:0 auto;padding:30px 28px 10px;border-radius:10px;text-align:left;color:#4a2233;opacity:0;
  font-family:'Dancing Script',cursive;font-weight:600;font-size:clamp(20px,5vw,25px);line-height:34px;
  background:repeating-linear-gradient(transparent 0 33px,rgba(255,126,182,.3) 33px 34px),#fff3ea;box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 40px rgba(255,126,182,.25)}
.paper.show{animation:unfold 1.1s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes unfold{from{opacity:0;transform:translateY(60px) scale(.85) rotateX(-30deg)}to{opacity:1;transform:none}}
.paper h2{font-size:1.45em;line-height:68px;color:#d63b78}
.paper p{margin-bottom:34px;opacity:0}
.paper.show p,.paper.show .sign{animation:fadeUp .8s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sign{text-align:right;color:#d63b78;margin-bottom:24px;opacity:0}
.memo{font-family:'Pacifico',cursive;font-size:26px;margin:54px 0 0;color:var(--orange);text-shadow:0 0 16px rgba(255,160,98,.5)}
.stage{perspective:1100px;margin-top:26px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;overflow:hidden;padding:30px 0}
.stage:active{cursor:grabbing}
.ring{position:relative;margin:0 auto;transform-style:preserve-3d}
.c3d{position:absolute;left:0;top:0;padding:5px 5px 18px;background:#fff7f1;border-radius:7px;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.c3d img{display:block;width:100%;height:100%;object-fit:cover;border-radius:4px;pointer-events:none;-webkit-user-drag:none}
.tip{margin-top:6px;font-size:14px;color:#ffc9dc;opacity:.8}
@media (prefers-reduced-motion:reduce){.cakeWrap,.env,.btn{animation:none}}
</style>
</head>
<body>
<canvas id="fall"></canvas>

<!-- ===== MÀN 1: tiêu đề + bánh + nút ===== -->
<main class="scene" id="intro">
  <h1><span class="t1" id="t1"></span><span class="name" id="name"></span></h1>

  <div class="cakeWrap" id="cake">
    <div class="wind" id="wind"></div>
    <div class="candles" id="candles"></div>
    <div class="tier ta"></div><div class="tier tb"></div><div class="tier tc"></div>
    <div class="plate"></div>
  </div>

  <div class="actions">
    <button class="btn" id="blow">🌬️ Thổi nến</button>
    <div class="envBox" id="envBox">
      <div class="env" id="env">
        <div class="e-back"></div><div class="e-paper"></div><div class="e-front"></div><div class="e-flap"></div><div class="seal">♥</div>
      </div>
      <div class="hint" id="hint">Chạm vào thư nhé 💌</div>
    </div>
  </div>
</main>

<!-- ===== MÀN 2: thư + vòng ảnh ===== -->
<section id="letterScene">
  <div class="paper" id="paper"></div>
  <div class="memo">Những khoảnh khắc của chúng mình</div>
  <div class="stage" id="stage"><div class="ring" id="ring"></div></div>
  <div class="tip">Kéo sang trái hoặc phải để xoay ✋</div>
</section>

<script>

const CONFIG = {
  name: "Nguyễn Ngọc Châu Giang",     
  age: 20,                   
  
  photos: ["images/1.jpg","images/2.jpg","images/3.jpg","images/4.jpg","images/5.jpg","images/6.jpg","images/7.jpg","images/8.jpg","images/9.jpg","images/10.jpg","images/11.jpg","images/12.jpg","images/13.jpg","images/14.jpg","images/15.jpg","images/16.jpg","images/17.jpg","images/18.jpg","images/19.jpg","images/20.jpg"
    
  ],
  letterTitle: "Chúc mừng sinh nhật Giang 20 tuổi người yêu Phong💕",
  letter: [
    "CMong tuổi mới sẽ thật rực rỡ, luôn được yêu thương, trân trọng và sống những ngày tháng hạnh phúc nhất với người mình yêu, luôn xinh gái và đạt được những gì mong muốn nhé🎉"
  ],
  sign: "— Người gửi ♥"
};

/* ===== Ảnh mẫu (tự tạo khi chưa có ảnh) ===== */
const EMO=['🎂','🎁','🎈','💖','🌸','✨','🧸','🍰'],GR=[['#ff9ec7','#ff7a59'],['#ffb48a','#e8497f'],['#ff7eb6','#ffa062'],['#ffc2a1','#d63f74']];
function sample(i){const [a,b]=GR[i%4];return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="380"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="300" height="380" fill="url(#g)"/><text x="150" y="225" font-size="110" text-anchor="middle">${EMO[i%8]}</text></svg>`)}
const PH=CONFIG.photos.length?CONFIG.photos:Array.from({length:8},(_,i)=>sample(i));

const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ===== Dựng tiêu đề + nến ===== */
document.title='Happy Birthday '+CONFIG.name;
[...'Happy Birthday'].forEach((ch,i)=>{const s=document.createElement('span');s.className='L';s.textContent=ch===' '?'\u00A0':ch;
  s.style.cssText=`color:hsl(${340+i*3.5} 100% 74%);animation-delay:${i*70}ms`;$('#t1').appendChild(s)});
$('#name').textContent=`“${CONFIG.name}”`;
$('#candles').innerHTML=[...String(CONFIG.age)].map(d=>`<div class="candle"><i class="flame"></i><i class="wick"></i><b class="digit">${d}</b></div>`).join('');

/* ===== Pháo giấy rơi (canvas) ===== */
const cv=$('#fall'),g=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);let P=[];
const COL=['#ff7eb6','#ff4d8d','#ffa062','#ffd1a6','#fff0e6','#ff9ec7','#ffb347'];
function rs(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;g.setTransform(dpr,0,0,dpr,0,0)}rs();addEventListener('resize',rs);
function mk(x,y,burst){return{x,y,s:rnd(6,12),c:COL[rnd(0,COL.length)|0],k:Math.random()*4|0,r:rnd(0,6.28),vr:rnd(-.08,.08),f:rnd(0,6.28),vf:rnd(.03,.09),
  vx:burst?rnd(-5,5):rnd(-.4,.4),vy:burst?rnd(-13,-4):rnd(.7,1.8),g:burst?.16:0,d:burst?.985:1,t:rnd(0,6.28),sw:burst?0:rnd(.3,.9)}}
const boom=(x,y,n=90)=>{for(let i=0;i<n;i++)P.push(mk(x,y,true))};
for(let i=0;i<40;i++)P.push(mk(rnd(0,innerWidth),rnd(-20,innerHeight),false));
(function loop(){
  g.clearRect(0,0,innerWidth,innerHeight);
  if(P.length<Math.min(90,innerWidth/9)&&Math.random()<.3)P.push(mk(rnd(0,innerWidth),-20,false));
  for(const p of P){
    p.vx*=p.d;p.vy+=p.g;if(p.g&&p.vy>1.8){p.g=0;p.d=1;p.sw=rnd(.3,.9)}
    p.x+=p.vx+Math.sin(p.t+=.03)*p.sw;p.y+=p.vy;p.r+=p.vr;p.f+=p.vf;
    g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.globalAlpha=.9;
    if(p.k==2){g.font=p.s*1.6+'px serif';g.textAlign='center';g.fillText('♥',0,0)}
    else if(p.k==1){g.beginPath();g.arc(0,0,p.s/2.4,0,6.28);g.fill()}
    else{g.scale(1,Math.cos(p.f));g.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66)}
    g.restore();
  }
  P=P.filter(p=>p.y<innerHeight+30);
  requestAnimationFrame(loop);
})();

/* ===== Thổi nến ===== */
$('#blow').onclick=async function(){
  const btn=this;btn.disabled=true;btn.style.pointerEvents='none';
  const wind=$('#wind'),w=wind.offsetWidth,flames=[...document.querySelectorAll('.flame')];
  for(let i=0;i<8;i++){const s=document.createElement('i');s.style.top=rnd(4,130)+'px';s.style.width=rnd(90,160)+'px';wind.appendChild(s);
    s.animate([{transform:'translateX(-170px)',opacity:0},{opacity:1,offset:.3},{transform:`translateX(${w+170}px)`,opacity:0}],{duration:950,delay:i*90,easing:'ease-in'})}
  await sleep(250);flames.forEach((f,i)=>setTimeout(()=>f.classList.add('bend'),i*80));
  await sleep(550);
  flames.forEach((f,i)=>setTimeout(()=>{f.classList.add('out');const s=document.createElement('i');s.className='smoke';f.parentNode.appendChild(s);setTimeout(()=>s.remove(),2000)},i*90));
  btn.animate([{opacity:1},{opacity:0,transform:'scale(.8)'}],{duration:400,fill:'forwards'});
  await sleep(700);
  const r=$('#cake').getBoundingClientRect();boom(r.left+r.width/2,r.top+60,110);
  const eb=$('#envBox');eb.style.pointerEvents='auto';btn.style.display='none';
  /* thư chui ra từ phía sau bánh */
  eb.animate([{transform:'translateY(-280px) scale(.45)',opacity:0},{opacity:1,offset:.15},{transform:'translateY(14px) scale(1.06)',opacity:1,offset:.75},{transform:'none',opacity:1}],
    {duration:1500,easing:'cubic-bezier(.3,.8,.3,1)',fill:'forwards'});
};

/* ===== Mở thư → ảnh phun ra → rơi xuống ===== */
$('#env').onclick=async function(){
  if(this.dataset.done)return;this.dataset.done=1;
  this.classList.add('open');$('#hint').style.visibility='hidden';document.body.classList.add('lock');
  await sleep(900);
  const r=this.getBoundingClientRect(),sx=r.left+r.width/2,sy=r.top+r.height/2,W=innerWidth,H=innerHeight;
  /* Tự tính số ảnh để phủ KÍN màn hình (ảnh ít thì lặp lại cho đủ) */
  const cols=Math.max(3,Math.round(W/170)),cw=W/cols,bw=cw*1.45,bh=bw*1.2,rows=Math.ceil(H/(bh*.62)),ch=H/rows,
    N=cols*rows,gap=Math.min(45,1400/N);
  const cells=[...Array(N).keys()].sort(()=>Math.random()-.5);
  const els=[];
  for(let i=0;i<N;i++){
    const w=bw*rnd(.95,1.08),h=w*1.2,c=cells[i],
      fx=(c%cols+.5)*cw+rnd(-.12,.12)*cw-w/2,fy=((c/cols|0)+.5)*ch+rnd(-.12,.12)*ch-h/2,
      px=(sx+fx)/2+rnd(-60,60),py=Math.min(sy,fy)-rnd(.15,.35)*H-h/2,rf=rnd(-22,22);
    const el=document.createElement('div');el.className='ph';el.style.width=w+'px';el.style.height=h+'px';
    el.innerHTML=`<img src="${PH[i%PH.length]}" alt="">`;document.body.appendChild(el);els.push({el,fx,fy,rf});
    el.animate([
      {transform:`translate(${sx-w/2}px,${sy-h/2}px) scale(.15) rotate(0deg)`,opacity:0,easing:'cubic-bezier(.15,.7,.35,1)'},
      {transform:`translate(${px}px,${py}px) scale(1.1) rotate(${rf*.5}deg)`,opacity:1,offset:.5,easing:'cubic-bezier(.5,0,.9,.6)'},
      {transform:`translate(${fx}px,${fy}px) scale(1) rotate(${rf}deg)`,opacity:1}
    ],{duration:1500,delay:i*gap,fill:'forwards'});
  }
  await sleep(N*gap+1500+500);
  /* đổi màn bên dưới lúc ảnh đang phủ kín */
  $('#intro').style.display='none';$('#letterScene').style.display='block';scrollTo(0,0);
  await sleep(150);
  els.forEach(({el,fx,fy,rf})=>{
    el.animate([{transform:`translate(${fx}px,${fy}px) scale(1) rotate(${rf}deg)`,opacity:1},
      {transform:`translate(${fx+rnd(-30,30)}px,${H+260}px) rotate(${rf+rnd(-40,40)}deg)`,opacity:1}],
      {duration:rnd(1100,1700),delay:rnd(0,700),easing:'cubic-bezier(.55,0,.9,.5)',fill:'forwards'})});
  await sleep(900);showLetter();
  await sleep(1500);els.forEach(o=>o.el.remove());document.body.classList.remove('lock');
};

function showLetter(){
  const p=$('#paper');
  p.innerHTML=`<h2>${CONFIG.letterTitle}</h2>`+CONFIG.letter.map(t=>`<p>${t}</p>`).join('')+`<div class="sign">${CONFIG.sign}</div>`;
  [...p.querySelectorAll('p,.sign')].forEach((e,i)=>e.style.animationDelay=(.7+i*.35)+'s');
  p.classList.add('show');
  boom(innerWidth/2,innerHeight*.35,70);
}

/* ===== Vòng ảnh 3D: tự quay + kéo để xoay ===== */
(function(){
  const ring=$('#ring'),stage=$('#stage'),n=Math.max(8,PH.length),
    cw=Math.min(140,innerWidth*.34),ch=cw*1.3,R=Math.round((cw/2)/Math.tan(Math.PI/n))+26;
  ring.style.width=cw+'px';ring.style.height=ch+'px';stage.style.height=ch+90+'px';
  for(let i=0;i<n;i++){const c=document.createElement('div');c.className='c3d';c.style.cssText=`width:${cw}px;height:${ch}px;transform:rotateY(${i*360/n}deg) translateZ(${R}px)`;
    c.innerHTML=`<img src="${PH[i%PH.length]}" alt="" draggable="false">`;ring.appendChild(c)}
  let a=0,v=.3,drag=false,lx=0;
  stage.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;stage.setPointerCapture(e.pointerId)});
  stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx;lx=e.clientX;a+=dx*.45;v=dx*.45});
  ['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t,()=>drag=false));
  (function tick(){if(!drag){v+=(.3-v)*.04;a+=v}
    ring.style.transform=`translateZ(${-R}px) rotateX(-8deg) rotateY(${a}deg)`;requestAnimationFrame(tick)})();
})();
</script>
</body>
</html>
